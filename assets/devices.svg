<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="PC and phone terminals">
<rect width="1000" height="300" rx="16" fill="#0b1220"/>

<g><rect x="60" y="50" width="420" height="210" rx="14" fill="#0a0f1a" stroke="#2a3a55"/><text x="80" y="90" font-family="monospace" font-size="18" fill="#22c55e">PC terminal</text><text x="80" y="130" font-family="monospace" font-size="17" fill="#e8eef7">$ ssh vps2</text><text x="80" y="165" font-family="monospace" font-size="17" fill="#9fb3cc">VPS-CONNECT-OK</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/></g>
<g><rect x="600" y="50" width="220" height="210" rx="22" fill="#0a0f1a" stroke="#f5c542"/><text x="620" y="90" font-family="monospace" font-size="17" fill="#f5c542">Termux</text><text x="620" y="130" font-family="monospace" font-size="16" fill="#e8eef7">$ ssh vps2</text><text x="620" y="165" font-family="monospace" font-size="16" fill="#22c55e">✓ OK</text><animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="4.5s" repeatCount="indefinite"/></g>

</svg>
