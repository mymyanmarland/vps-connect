<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Terminal to hub to many VPS nodes">
<rect width="1100" height="320" rx="16" fill="#0b1220"/>

<g font-family="sans-serif" font-size="18" fill="#e8eef7">
<rect x="40" y="110" width="200" height="100" rx="14" fill="#0a0f1a" stroke="#f5c542"/><text x="140" y="150" text-anchor="middle">Your terminal</text><text x="140" y="180" text-anchor="middle" fill="#9fb3cc">PC or phone</text>
<rect x="430" y="110" width="200" height="100" rx="14" fill="#111c33" stroke="#7dd3fc"/><text x="530" y="150" text-anchor="middle">connect-vps.sh</text><text x="530" y="180" text-anchor="middle" fill="#9fb3cc">key + alias</text>
</g>
<g stroke="#f5c542" stroke-width="3" fill="none">
<path d="M240 160 H430"/><path d="M630 160 H820 L960 70"/><path d="M630 160 H820 L960 160"/><path d="M630 160 H820 L960 250"/>
</g>
<circle r="6" fill="#f5c542"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M240 160 H430"/></circle> <circle r="6" fill="#22c55e"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M630 160 H820 L960 70"/></circle> <circle r="6" fill="#7dd3fc"><animateMotion dur="3s" begin=".7s" repeatCount="indefinite" path="M630 160 H820 L960 160"/></circle> <circle r="6" fill="#f5c542"><animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M630 160 H820 L960 250"/></circle>
<g font-family="sans-serif" font-size="18" fill="#e8eef7">
<rect x="960" y="35" width="110" height="70" rx="12" fill="#0a0f1a" stroke="#22c55e"/><text x="1015" y="75" text-anchor="middle">vps2</text>
<rect x="960" y="125" width="110" height="70" rx="12" fill="#0a0f1a" stroke="#7dd3fc"/><text x="1015" y="165" text-anchor="middle">vps3</text>
<rect x="960" y="215" width="110" height="70" rx="12" fill="#0a0f1a" stroke="#f5c542"/><text x="1015" y="255" text-anchor="middle">prod</text>
</g>

</svg>
