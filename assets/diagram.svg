<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="How vps-connect works diagram">
  <rect width="1000" height="280" rx="16" fill="#0f172a"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="30" y="70" width="210" height="120" rx="14" fill="#111c33" stroke="#f5c542"/>
    <text x="135" y="120" font-size="20" font-weight="700" fill="#f5c542">Your terminal</text>
    <text x="135" y="150" font-size="15" fill="#d7e3f4">PC or phone</text>
    <text x="135" y="172" font-size="15" fill="#9fb3cc">Termux, macOS, Linux</text>
    <rect x="390" y="70" width="220" height="120" rx="14" fill="#111c33" stroke="#22c55e"/>
    <text x="500" y="120" font-size="20" font-weight="700" fill="#22c55e">SSH key + alias</text>
    <text x="500" y="150" font-size="15" fill="#d7e3f4">Only .pub is copied</text>
    <text x="500" y="172" font-size="15" fill="#9fb3cc">Config backed up first</text>
    <rect x="760" y="70" width="210" height="120" rx="14" fill="#111c33" stroke="#7dd3fc"/>
    <text x="865" y="120" font-size="20" font-weight="700" fill="#7dd3fc">Any VPS</text>
    <text x="865" y="150" font-size="15" fill="#d7e3f4">ssh vps2</text>
    <text x="865" y="172" font-size="15" fill="#9fb3cc">No IP to remember</text>
  </g>
  <g stroke="#f5c542" stroke-width="3" fill="none">
    <path d="M245 130 H385" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M615 130 H755" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>
  <text x="500" y="240" font-family="sans-serif" font-size="16" fill="#9fb3cc" text-anchor="middle">Diagram: one script run per terminal — then connect with a short alias, on any VPS.</text>
</svg>
