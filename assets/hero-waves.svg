<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Hero waves and floating terminals">
<rect width="1200" height="380" rx="16" fill="#0b1220"/>

<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1220"/><stop offset="60%" stop-color="#111c33"/><stop offset="100%" stop-color="#0f2a22"/></linearGradient></defs>
<rect width="1200" height="380" fill="url(#g)"/>
<g fill="none" stroke="#22c55e" stroke-opacity="0.35"><path d="M0 300 Q150 260 300 300 T600 300 T900 300 T1200 300"><animate attributeName="d" values="M0 300 Q150 260 300 300 T600 300 T900 300 T1200 300;M0 310 Q150 280 300 310 T600 310 T900 310 T1200 310;M0 300 Q150 260 300 300 T600 300 T900 300 T1200 300" dur="7s" repeatCount="indefinite"/></path>
<path d="M0 330 Q200 300 400 330 T800 330 T1200 330" stroke="#f5c542" stroke-opacity="0.3"><animate attributeName="d" values="M0 330 Q200 300 400 330 T800 330 T1200 330;M0 340 Q200 315 400 340 T800 340 T1200 340;M0 330 Q200 300 400 330 T800 330 T1200 330" dur="9s" repeatCount="indefinite"/></path></g>
<circle cx="120" cy="90" r="7" fill="#f5c542"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle> <circle cx="1050" cy="80" r="6" fill="#7dd3fc"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle> <circle cx="900" cy="180" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="3s" begin=".5s" repeatCount="indefinite"/></circle> <circle cx="250" cy="140" r="5" fill="#7dd3fc"><animate attributeName="opacity" values="1;.3;1" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
<g><rect x="180" y="80" width="300" height="170" rx="14" fill="#0a0f1a" stroke="#2a3a55"/><text x="200" y="115" font-family="monospace" font-size="18" fill="#22c55e">$ ssh vps2</text><text x="200" y="150" font-family="monospace" font-size="16" fill="#9fb3cc">VPS-CONNECT-OK</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/></g>
<g><rect x="700" y="110" width="300" height="170" rx="14" fill="#0a0f1a" stroke="#f5c542"/><text x="720" y="145" font-family="monospace" font-size="18" fill="#f5c542">$ ./connect-vps.sh</text><text x="720" y="180" font-family="monospace" font-size="16" fill="#22c55e">Alias added: ssh vps2</text><animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/></g>
<text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#e8eef7">vps-connect</text>
<text x="600" y="330" text-anchor="middle" font-family="monospace" font-size="18" fill="#9fb3cc">One script. One alias. No IP to remember.</text>

</svg>
