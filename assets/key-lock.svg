<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Key generation and lock">
<rect width="900" height="280" rx="16" fill="#0b1220"/>

<g font-family="monospace" font-size="20" fill="#e8eef7">
<rect x="60" y="90" width="320" height="110" rx="14" fill="#0a0f1a" stroke="#2a3a55"/><text x="80" y="130">~/.ssh/id_ed25519</text><text x="80" y="165" fill="#22c55e">.pub -&gt; VPS only</text>
</g>
<circle cx="560" cy="145" r="52" fill="none" stroke="#f5c542" stroke-width="6"><animate attributeName="stroke-dashoffset" values="326;0" dur="3s" repeatCount="indefinite"/></circle>
<g><rect x="530" y="125" width="60" height="45" rx="8" fill="#22c55e"/><rect x="545" y="100" width="30" height="30" rx="14" fill="none" stroke="#22c55e" stroke-width="7"/><animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.5s" repeatCount="indefinite"/></g>
<text x="700" y="145" font-family="sans-serif" font-size="24" fill="#22c55e">locked ✓</text>
<text x="450" y="250" text-anchor="middle" font-family="monospace" font-size="17" fill="#9fb3cc">Private key never leaves your device</text>

</svg>
